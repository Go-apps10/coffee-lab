<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة الطلبات | Coffee Lab</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2b1a12">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="page admin">

<header class="nav nav-dark">
  <div class="container nav-inner">
    <a href="admin.html" class="logo" aria-label="Coffee Lab">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M15 4h10v3h-2v9l9 15a4 4 0 0 1-3.4 6H11.4A4 4 0 0 1 8 31l9-15V7h-2z" fill="currentColor"/><path d="M12.5 27h15l2.6 4.3a1.3 1.3 0 0 1-1.1 2H11a1.3 1.3 0 0 1-1.1-2z" fill="#c8894b"/></svg>
      <span>Coffee<b>Lab</b> <small>Admin</small></span>
    </a>
    <div class="head-actions">
      <span class="live" id="liveDot" hidden><i></i>مباشر</span>
      <a href="index.html" class="btn btn-ghost light btn-sm">المتجر</a>
      <button class="btn btn-ghost light btn-sm" id="signOutBtn" hidden>خروج</button>
    </div>
  </div>
</header>

<main class="container page-main">
  <div class="loading" id="loading"><span class="spin"></span>بنحمّل اللوحة…</div>

  <section class="card-box narrow-box" id="msgView" hidden>
    <h1 id="msgTitle"></h1>
    <p class="muted" id="msgText"></p>
    <div id="msgAction"></div>
  </section>

  <section id="dashView" hidden>
    <div class="page-head">
      <div><span class="eyebrow">لوحة الأدمن</span><h1>الطلبات</h1></div>
      <button class="btn btn-ghost btn-sm" id="soundBtn" title="صوت تنبيه للطلبات الجديدة">🔔 التنبيه شغال</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <div class="status-tabs" id="statusTabs"></div>
      <input type="search" id="search" placeholder="دوّر برقم الطلب، الاسم أو الموبايل…">
    </div>

    <div class="orders-table" id="ordersTable"></div>
  </section>
</main>

<!-- ORDER DETAILS -->
<div class="modal" id="orderModal" hidden>
  <div class="modal-box wide" role="dialog" aria-modal="true" aria-labelledby="omTitle">
    <button class="close" data-close aria-label="إغلاق">×</button>
    <div id="orderDetail"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="firebase.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
